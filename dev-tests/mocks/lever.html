<!doctype html><html><head><title>Acme - Data Analyst</title></head><body>
<div class="posting-headline"><h2>Data Analyst</h2></div>
<form id="application-form" action="/acme/123/apply" method="POST" onsubmit="window.__submitted=true;return false;">
<ul>
 <li class="application-question resume"><label><div class="application-label">Resume/CV<span class="required">✱</span></div><div class="application-field"><input type="file" name="resume" id="resume-upload-input"></div></label></li>
 <li class="application-question"><label><div class="application-label">Full name<span class="required">✱</span></div><div class="application-field"><input type="text" name="name"></div></label></li>
 <li class="application-question"><label><div class="application-label">Email<span class="required">✱</span></div><div class="application-field"><input type="email" name="email"></div></label></li>
 <li class="application-question"><label><div class="application-label">Phone</div><div class="application-field"><input type="text" name="phone"></div></label></li>
 <li class="application-question"><label><div class="application-label">Current company</div><div class="application-field"><input type="text" name="org"></div></label></li>
 <li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
</ul>
<ul>
 <li class="application-question custom-question"><div class="application-label full-width"><div class="text">Are you currently authorized to work in the U.S.?<span class="required">✱</span></div></div>
  <div class="application-field"><ul><li><label><input type="radio" name="cards[abc][field0]" value="Yes"><span class="application-answer-alternative">Yes</span></label></li><li><label><input type="radio" name="cards[abc][field0]" value="No"><span class="application-answer-alternative">No</span></label></li></ul></div></li>
 <li class="application-question custom-question"><div class="application-label full-width"><div class="text">Which tools have you used?</div></div>
  <div class="application-field"><ul><li><label><input type="checkbox" name="cards[abc][field1]" value="SQL"><span>SQL</span></label></li><li><label><input type="checkbox" name="cards[abc][field1]" value="Power BI"><span>Power BI</span></label></li><li><label><input type="checkbox" name="cards[abc][field1]" value="Tableau"><span>Tableau</span></label></li></ul></div></li>
 <li class="application-question custom-question"><div class="application-label full-width"><div class="text">Have you previously worked at Acme? If so, please share the email you used.</div></div>
  <div class="application-field"><input type="text" name="cards[abc][field2]"></div></li>
</ul>
<div class="eeo-section">
 <label><div class="application-label">Gender</div><select name="eeo[gender]"><option value="">Select ...</option><option value="Male">Male</option><option value="Female">Female</option><option value="Decline to self-identify">Decline to self-identify</option></select></label>
 <label><div class="application-label">Race</div><select name="eeo[race]"><option value="">Select ...</option><option>Hispanic or Latino</option><option>White (Not Hispanic or Latino)</option><option>Middle Eastern or North African</option><option>Decline to self-identify</option></select></label>
 <label><div class="application-label">Veteran status</div><select name="eeo[veteran]"><option value="">Select ...</option><option>I am a veteran</option><option>I am not a veteran</option><option>Decline to self-identify</option></select></label>
</div>
<button type="submit" class="template-btn-submit">Submit application</button>
</form></body></html>
