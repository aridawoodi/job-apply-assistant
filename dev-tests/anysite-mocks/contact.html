<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Contact us · Example Company</title>
<style>body{font:15px/1.5 system-ui,sans-serif;max-width:600px;margin:24px auto}label{display:block;margin:10px 0 3px}input,textarea{width:100%;padding:7px;box-sizing:border-box}</style></head>
<body><h1>Contact us</h1><p>Questions about our products? Send us a message.</p>
<form id="contact" onsubmit="window.__submitted=(window.__submitted||0)+1;return false">
  <label for="c1">Name</label><input id="c1" name="name">
  <label for="c2">Email</label><input id="c2" name="email" type="email">
  <label for="c3">Phone</label><input id="c3" name="phone" type="tel">
  <label for="c4">Message</label><textarea id="c4" name="message" rows="5"></textarea>
  <button type="submit">Send</button>
</form></body></html>
