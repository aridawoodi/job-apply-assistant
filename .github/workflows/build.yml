name: lint-and-build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint (syntax, manifest, no remote code, no personal data)
        run: node scripts/lint.js
      - name: Unit tests
        run: node dev-tests/unit-v4.js && node dev-tests/unit-v6.js
      - name: Build the store zip
        run: python3 scripts/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: job-apply-assistant-zip
          path: dist/*.zip
